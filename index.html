<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bolo Kurowo — Tabungan & Sosial</title>
<style>
:root{--navy:#07506b;--blue:#19a9d7;--gold:#f2c94c;--bg:#f4f8fa;--card:#fff;--text:#17313d;--muted:#6b7d85;--danger:#c94b4b;--ok:#2e8b57;--line:#dce7eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.hidden{display:none!important}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#eef8fb,#fff)}
.login-card{width:min(420px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 60px #07506b1c;text-align:center}
.logo{width:115px;height:115px;object-fit:contain;border-radius:50%}.login h1{margin:8px 0 2px;color:var(--navy);letter-spacing:1px}.tag{color:var(--muted);margin:0 0 22px}
.form{text-align:left;display:grid;gap:12px}.form label{font-size:13px;font-weight:700}.form input,.form select,.form textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;outline:none;background:#fff}.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #19a9d71a}
.btn{padding:11px 15px;border-radius:12px;font-weight:800}.primary{background:var(--navy);color:#fff}.secondary{background:#e9f5f8;color:var(--navy)}.danger{background:#fdecec;color:var(--danger)}.gold{background:var(--gold);color:#17313d}
.demo{margin-top:18px;padding:12px;border-radius:12px;background:#f6fafb;font-size:12px;color:var(--muted)}
.layout{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--navy);color:#fff;padding:18px;position:fixed;inset:0 auto 0 0}.brand{display:flex;align-items:center;gap:10px;padding:4px 4px 20px}.brand img{width:46px;height:46px;border-radius:50%;object-fit:contain;background:#fff}.brand b{display:block}.brand small{opacity:.75}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#dceff4;text-align:left;padding:12px;border-radius:11px;font-weight:700}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.logout{position:absolute;left:18px;right:18px;bottom:18px;background:#fff;color:var(--navy)}
.main{margin-left:250px;width:calc(100% - 250px);padding:24px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.topbar h2{margin:0}.pill{padding:7px 10px;border-radius:999px;background:#e8f6fa;color:var(--navy);font-size:12px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 22px #17313d08}.stat .label{font-size:12px;color:var(--muted);font-weight:700}.stat .value{font-size:25px;font-weight:900;margin-top:7px;color:var(--navy)}
.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h3{margin:0}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{background:#f7fbfc;color:var(--muted);font-size:11px;text-transform:uppercase}.table tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.badge.ok{background:#e9f7ef;color:var(--ok)}.badge.no{background:#fff1f1;color:var(--danger)}
.modal{position:fixed;inset:0;background:#17313d80;display:grid;place-items:center;padding:20px;z-index:10}.modal-card{width:min(520px,100%);background:#fff;border-radius:20px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.x{background:#eef4f6;border-radius:50%;width:34px;height:34px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{position:fixed;right:20px;bottom:20px;background:#17313d;color:#fff;padding:12px 15px;border-radius:12px;z-index:20;box-shadow:0 8px 30px #0002}
.mobile-menu{display:none}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:900px){.sidebar{width:220px}.main{margin-left:220px;width:calc(100% - 220px)}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.sidebar{transform:translateX(-100%);transition:.2s;z-index:9}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%;padding:16px}.mobile-menu{display:inline-block;background:#fff;border:1px solid var(--line);padding:9px 11px;border-radius:10px}.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.topbar{gap:10px}.topbar h2{font-size:20px}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="login-card">
    <img id="loginLogo" class="logo" alt="Logo Bolo Kurowo">
    <h1>BOLO KUROWO</h1><p class="tag">Since 2024 · Khairunnas anfa'uhum linnas</p>
    <form id="loginForm" class="form">
      <label>Username</label><input id="username" required placeholder="Username">
      <label>Password</label><input id="password" type="password" required placeholder="Password">
      <button class="btn primary">Masuk</button>
    </form>
  </div>
</div>

<div id="appView" class="app hidden">
<div class="layout">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><img id="sideLogo" alt=""><div><b>BOLO KUROWO</b><small>Since 2024</small></div></div>
    <nav id="nav" class="nav"></nav>
    <button id="logout" class="btn logout">Keluar</button>
  </aside>
  <main class="main">
    <div class="topbar"><div><button class="mobile-menu" id="menuBtn">☰</button><span id="pageTitle" style="margin-left:8px"></span></div><span id="rolePill" class="pill"></span></div>
    <div id="content"></div>
  </main>
</div>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>

document.getElementById('loginLogo').src=LOGO;document.getElementById('sideLogo').src=LOGO;
let session=null,page='dashboard', cache={members:[],savings:[],transactions:[],activities:[],announcements:[]};
const $=id=>document.getElementById(id);
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function fmt(d){return d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.add('hidden'),2400)}
function errMsg(e){return e?.message||'Terjadi kesalahan.'}
function usernameToEmail(username){const u=String(username||'').trim().toLowerCase();if(u==='admin')return ADMIN_LOGIN_EMAIL;if(u.includes('@'))return u;return u+'@bolokurowo.local'}
async function loadProfile(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user)return null;const {data,error}=await supabaseClient.from('profiles').select('*').eq('id',user.id).single();if(error)throw error;return {...data,auth_id:user.id,email:user.email}}
async function login(username,password){
  if(SUPABASE_PUBLISHABLE_KEY==='PASTE_YOUR_PUBLISHABLE_KEY_HERE'){toast('Publishable key belum ditempel ke aplikasi.');return}
  const email=usernameToEmail(username);const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){toast('Username atau password salah');return}
  try{const p=await loadProfile();if(!p){await supabaseClient.auth.signOut();toast('Profil pengguna belum dibuat di profiles');return}if(!p.active){await supabaseClient.auth.signOut();toast('Akun tidak aktif');return}session=p;page='dashboard';$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await render()}catch(e){await supabaseClient.auth.signOut();toast(errMsg(e))}
}
$('loginForm').onsubmit=async e=>{e.preventDefault();await login($('username').value,$('password').value)};
$('logout').onclick=async()=>{await supabaseClient.auth.signOut();session=null;cache={members:[],savings:[],transactions:[],activities:[],announcements:[]};$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');$('loginForm').reset()};
$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');
function navItems(){return session.role==='admin'?[['dashboard','🏠 Dashboard'],['members','👥 Anggota'],['savings','💰 Tabungan'],['transactions','📊 Keuangan'],['reports','📑 Laporan'],['activities','📅 Kegiatan'],['settings','🔐 Keamanan']]:[['dashboard','🏠 Dashboard'],['savings','💰 Tabungan Saya'],['reports','📑 Laporan'],['activities','📅 Kegiatan']]}
function renderNav(){$('nav').innerHTML=navItems().map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
async function go(p){page=p;$('sidebar').classList.remove('open');await render()}
async function render(){renderNav();$('rolePill').textContent=session.role==='admin'?'ADMIN':'ANGGOTA';$('pageTitle').textContent=(navItems().find(x=>x[0]===page)?.[1]||'').replace(/^\S+\s/,'');const f={dashboard:renderDashboard,members:renderMembers,savings:renderSavings,transactions:renderTransactions,reports:renderReports,activities:renderActivities,settings:renderSettings}[page]||renderDashboard;await f()}
async function loadData(){
  const admin=session.role==='admin';
  const jobs=[];
  jobs.push(supabaseClient.from('profiles').select('id,username,full_name,phone,role,active,created_at').order('full_name'));
  jobs.push(supabaseClient.from('savings').select('id,member_id,amount,savings_type,date,note,created_at,member:profiles!savings_member_id_fkey(full_name,username)') .order('date',{ascending:false}).order('created_at',{ascending:false}));
  if(admin)jobs.push(supabaseClient.from('transactions').select('id,type,amount,category,description,date,created_at').order('date',{ascending:false}).order('created_at',{ascending:false}));
  jobs.push(supabaseClient.from('activities').select('id,name,date,location,description,created_at').order('date',{ascending:false}).order('created_at',{ascending:false}));
  jobs.push(supabaseClient.from('announcements').select('id,title,content,created_at').order('created_at',{ascending:false}));
  const rs=await Promise.all(jobs);
  for(const r of rs)if(r.error)throw r.error;
  let i=0;cache.members=rs[i++].data||[];cache.savings=rs[i++].data||[];cache.transactions=admin?(rs[i++].data||[]):[];cache.activities=rs[i++].data||[];cache.announcements=rs[i++].data||[];
}
function totals(){return {savings:cache.savings.reduce((a,b)=>a+Number(b.amount),0),income:cache.transactions.filter(x=>x.type==='income').reduce((a,b)=>a+Number(b.amount),0),expense:cache.transactions.filter(x=>x.type==='expense').reduce((a,b)=>a+Number(b.amount),0)}}
function weekStart(d=today()){let x=new Date(d+'T00:00:00');let day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x.toISOString().slice(0,10)}
function weekPaid(mid){const k=weekStart();return cache.savings.some(s=>s.member_id===mid&&weekStart(s.date)===k)}
async function renderDashboard(){try{await loadData();const t=totals(),cash=t.income-t.expense;let mine=cache.savings.filter(s=>s.member_id===session.id).reduce((a,b)=>a+Number(b.amount),0);let recent=cache.transactions.slice(0,5);$('content').innerHTML=`<div class="grid">${session.role==='admin'?`<div class="card stat"><div class="label">Total anggota</div><div class="value">${cache.members.filter(m=>m.active&&m.role==='member').length}</div></div><div class="card stat"><div class="label">Total tabungan</div><div class="value">${money(t.savings)}</div></div>`:`<div class="card stat"><div class="label">Tabungan saya</div><div class="value">${money(mine)}</div></div><div class="card stat"><div class="label">Status minggu ini</div><div class="value" style="font-size:18px">${weekPaid(session.id)?'✅ Sudah setor':'⚠️ Belum setor'}</div></div>`}<div class="card stat"><div class="label">Saldo kas</div><div class="value">${session.role==='admin'?money(cash):'—'}</div></div><div class="card stat"><div class="label">Kegiatan</div><div class="value">${cache.activities.length}</div></div></div><div class="section"><div class="section-head"><h3>${session.role==='admin'?'Transaksi terbaru':'Informasi terbaru'}</h3></div><div class="table-wrap">${session.role==='admin'&&recent.length?`<table class="table"><thead><tr><th>Tanggal</th><th>Jenis</th><th>Keterangan</th><th>Nominal</th></tr></thead><tbody>${recent.map(x=>`<tr><td>${fmt(x.date)}</td><td>${x.type==='income'?'Pemasukan':'Pengeluaran'}</td><td>${esc(x.description||x.category||'-')}</td><td>${money(x.amount)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">Data tersimpan online di Supabase.</div>`}</div></div>`}catch(e){$('content').innerHTML=`<div class="card"><b>Gagal memuat data.</b><p>${esc(errMsg(e))}</p></div>`}}
async function renderMembers(){try{await loadData();$('content').innerHTML=`<div class="section-head"><div><h3>Data Anggota</h3><p style="color:var(--muted);margin:4px 0 0">Akun login dibuat dari Authentication → Users. Setelah akun dibuat, profilnya dapat dilengkapi di sini.</p></div><button class="btn primary" onclick="memberModal()">+ Lengkapi Anggota</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>Username</th><th>No. HP</th><th>Status</th><th>Total Tabungan</th><th>Aksi</th></tr></thead><tbody>${cache.members.filter(m=>m.role==='member').map(m=>{let total=cache.savings.filter(s=>s.member_id===m.id).reduce((a,b)=>a+Number(b.amount),0);return `<tr><td><b>${esc(m.full_name)}</b></td><td>${esc(m.username)}</td><td>${esc(m.phone||'-')}</td><td><span class="badge ${m.active?'ok':'no'}">${m.active?'Aktif':'Nonaktif'}</span></td><td>${money(total)}</td><td><button class="btn secondary" onclick="memberModal('${m.id}')">Edit</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Belum ada profil anggota.</td></tr>'}</tbody></table></div>`}catch(e){$('content').innerHTML=`<div class="card">${esc(errMsg(e))}</div>`}}
function memberModal(id){if(session.role!=='admin')return;const m=cache.members.find(x=>x.id===id)||{id:'',username:'',full_name:'',phone:'',active:true};showModal(`<div class="modal-head"><h3>${id?'Edit':'Lengkapi'} Anggota</h3><button class="x" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveMember(event,'${id}')">${id?`<label>Username</label><input value="${esc(m.username)}" disabled>`:`<label>UID Auth User</label><input name="id" required placeholder="Tempel UID dari Authentication → Users"><label>Username</label><input name="username" required placeholder="contoh: anggota2">`}<label>Nama Lengkap</label><input name="full_name" value="${esc(m.full_name||'')}" required><label>No. HP</label><input name="phone" value="${esc(m.phone||'')}"><label>Status</label><select name="active"><option value="true" ${m.active?'selected':''}>Aktif</option><option value="false" ${!m.active?'selected':''}>Nonaktif</option></select><button class="btn primary">Simpan</button></form>`)}
async function saveMember(e,id){e.preventDefault();const f=new FormData(e.target);try{if(id){const {error}=await supabaseClient.from('profiles').update({full_name:f.get('full_name'),phone:f.get('phone')||null,active:f.get('active')==='true'}).eq('id',id);if(error)throw error}else{const uid=String(f.get('id')).trim();const {data:auths,error:ae}=await supabaseClient.from('profiles').select('id').eq('id',uid).maybeSingle();if(ae)throw ae;if(auths){toast('Profil untuk UID tersebut sudah ada');return}const {error}=await supabaseClient.from('profiles').insert({id:uid,username:String(f.get('username')).trim(),full_name:f.get('full_name'),phone:f.get('phone')||null,role:'member',active:f.get('active')==='true'});if(error)throw error}closeModal();toast('Profil anggota tersimpan');await render()}catch(e){toast(errMsg(e))}}
async function renderSavings(){try{await loadData();if(session.role==='member'){const arr=cache.savings.filter(s=>s.member_id===session.id),total=arr.reduce((a,b)=>a+Number(b.amount),0);$('content').innerHTML=`<div class="grid"><div class="card stat"><div class="label">Total tabungan</div><div class="value">${money(total)}</div></div><div class="card stat"><div class="label">Setoran minggu ini</div><div class="value" style="font-size:18px">${weekPaid(session.id)?'✅ Sudah setor':'⚠️ Belum setor'}</div></div></div><div class="section"><div class="section-head"><h3>Riwayat Setoran</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Nominal</th><th>Keterangan</th></tr></thead><tbody>${arr.length?arr.map(s=>`<tr><td>${fmt(s.date)}</td><td>${money(s.amount)}</td><td>${esc(s.note||'Tabungan mingguan')}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">Belum ada setoran.</td></tr>'}</tbody></table></div></div>`;return}$('content').innerHTML=`<div class="section-head"><div><h3>Tabungan Anggota</h3><p style="color:var(--muted);margin:4px 0 0">Data tersimpan di Supabase.</p></div><button class="btn primary" onclick="savingModal()">+ Catat Setoran</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Anggota</th><th>Nominal</th><th>Keterangan</th><th>Aksi</th></tr></thead><tbody>${cache.savings.map(s=>`<tr><td>${fmt(s.date)}</td><td>${esc(s.member?.full_name||'')}</td><td>${money(s.amount)}</td><td>${esc(s.note||'Tabungan mingguan')}</td><td><button class="btn secondary" onclick="savingModal('${s.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada setoran.</td></tr>'}</tbody></table></div>`}catch(e){$('content').innerHTML=`<div class="card">${esc(errMsg(e))}</div>`}}
function savingModal(id){const item=cache.savings.find(s=>s.id===id);showModal(`<div class="modal-head"><h3>${item?'Edit Setoran':'Catat Setoran'}</h3><button class="x" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveSaving(event,'${id||''}')"><label>Anggota</label><select name="member_id" required>${cache.members.filter(m=>m.role==='member'&&(m.active||m.id===item?.member_id)).map(m=>`<option value="${m.id}" ${m.id===item?.member_id?'selected':''}>${esc(m.full_name)}</option>`).join('')}</select><div class="row"><div><label>Tanggal</label><input type="date" name="date" value="${item?.date||today()}" required></div><div><label>Nominal</label><input type="number" name="amount" min="1" step="1" value="${item?.amount??10000}" required></div></div><label>Keterangan</label><input name="note" value="${esc(item?.note||'Tabungan mingguan')}"><button class="btn primary">Simpan</button></form>`)}
async function saveSaving(e,id){e.preventDefault();try{const f=new FormData(e.target),data={member_id:f.get('member_id'),date:f.get('date'),amount:Number(f.get('amount')),note:f.get('note')||'Tabungan mingguan',created_by:session.id};let r=id?await supabaseClient.from('savings').update(data).eq('id',id):await supabaseClient.from('savings').insert(data);if(r.error)throw r.error;closeModal();toast('Setoran tersimpan');await render()}catch(e){toast(errMsg(e))}}
async function renderTransactions(){try{await loadData();const t=totals();$('content').innerHTML=`<div class="section-head"><h3>Keuangan Kas</h3><div><button class="btn primary" onclick="transactionModal('income')">+ Pemasukan</button> <button class="btn gold" onclick="transactionModal('expense')">+ Pengeluaran</button></div></div><div class="grid"><div class="card stat"><div class="label">Pemasukan</div><div class="value">${money(t.income)}</div></div><div class="card stat"><div class="label">Pengeluaran</div><div class="value">${money(t.expense)}</div></div><div class="card stat"><div class="label">Saldo kas</div><div class="value">${money(t.income-t.expense)}</div></div></div><div class="section"><div class="table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Keterangan</th><th>Nominal</th><th>Aksi</th></tr></thead><tbody>${cache.transactions.map(x=>`<tr><td>${fmt(x.date)}</td><td>${x.type==='income'?'Pemasukan':'Pengeluaran'}</td><td>${esc(x.category)}</td><td>${esc(x.description||'')}</td><td>${money(x.amount)}</td><td><button class="btn danger" onclick="deleteTx('${x.id}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada transaksi.</td></tr>'}</tbody></table></div></div>`}catch(e){$('content').innerHTML=`<div class="card">${esc(errMsg(e))}</div>`}}
function transactionModal(type){showModal(`<div class="modal-head"><h3>${type==='income'?'Tambah Pemasukan':'Tambah Pengeluaran'}</h3><button class="x" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveTx(event,'${type}')"><label>Tanggal</label><input type="date" name="date" value="${today()}" required><label>Kategori</label><input name="category" required><label>Nominal</label><input type="number" name="amount" min="1" required><label>Keterangan</label><textarea name="description" rows="3"></textarea><button class="btn primary">Simpan</button></form>`)}
async function saveTx(e,type){e.preventDefault();try{const f=new FormData(e.target),r=await supabaseClient.from('transactions').insert({type, date:f.get('date'),category:f.get('category'),amount:Number(f.get('amount')),description:f.get('description')||'',created_by:session.id});if(r.error)throw r.error;closeModal();toast('Transaksi tersimpan');await render()}catch(e){toast(errMsg(e))}}
async function deleteTx(id){if(!confirm('Hapus transaksi ini?'))return;const {error}=await supabaseClient.from('transactions').delete().eq('id',id);if(error)toast(errMsg(error));else{toast('Transaksi dihapus');await render()}}
async function renderReports(){try{await loadData();const t=totals();let mine=cache.savings.filter(s=>s.member_id===session.id).reduce((a,b)=>a+Number(b.amount),0);$('content').innerHTML=`<div class="card"><h3>Laporan</h3><p style="color:var(--muted)">${session.role==='admin'?'Ringkasan dana tabungan dan kas.':'Ringkasan tabungan pribadi.'}</p><div class="grid">${session.role==='admin'?`<div class="stat"><div class="label">Tabungan anggota</div><div class="value">${money(t.savings)}</div></div><div class="stat"><div class="label">Pemasukan kas</div><div class="value">${money(t.income)}</div></div><div class="stat"><div class="label">Pengeluaran kas</div><div class="value">${money(t.expense)}</div></div><div class="stat"><div class="label">Saldo kas</div><div class="value">${money(t.income-t.expense)}</div></div>`:`<div class="stat"><div class="label">Tabungan saya</div><div class="value">${money(mine)}</div></div>`}</div></div>`}catch(e){$('content').innerHTML=`<div class="card">${esc(errMsg(e))}</div>`}}
async function renderActivities(){try{await loadData();$('content').innerHTML=`<div class="section-head"><h3>Kegiatan Bolo Kurowo</h3>${session.role==='admin'?'<button class="btn primary" onclick="activityModal()">+ Tambah Kegiatan</button>':''}</div><div class="grid">${cache.activities.length?cache.activities.map(a=>`<div class="card"><h3>${esc(a.name)}</h3><p>${fmt(a.date)} · ${esc(a.location||'')}</p><p style="color:var(--muted)">${esc(a.description||'')}</p>${session.role==='admin'?`<button class="btn danger" onclick="deleteActivity('${a.id}')">Hapus</button>`:''}</div>`).join(''):'<div class="card" style="grid-column:1/-1"><div class="empty">Belum ada kegiatan.</div></div>'}</div>`}catch(e){$('content').innerHTML=`<div class="card">${esc(errMsg(e))}</div>`}}
function activityModal(){showModal(`<div class="modal-head"><h3>Tambah Kegiatan</h3><button class="x" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveActivity(event)"><label>Nama kegiatan</label><input name="name" required><label>Tanggal</label><input type="date" name="date" required><label>Lokasi</label><input name="location"><label>Deskripsi</label><textarea name="description" rows="3"></textarea><button class="btn primary">Simpan</button></form>`)}
async function saveActivity(e){e.preventDefault();try{const f=new FormData(e.target),r=await supabaseClient.from('activities').insert({name:f.get('name'),date:f.get('date'),location:f.get('location')||'',description:f.get('description')||'',created_by:session.id});if(r.error)throw r.error;closeModal();toast('Kegiatan ditambahkan');await render()}catch(e){toast(errMsg(e))}}
async function deleteActivity(id){if(!confirm('Hapus kegiatan?'))return;const {error}=await supabaseClient.from('activities').delete().eq('id',id);if(error)toast(errMsg(error));else{toast('Kegiatan dihapus');await render()}}
async function renderSettings(){$('content').innerHTML=`<div class="card" style="max-width:600px"><h3>Keamanan</h3><p style="color:var(--muted)">Password login dikelola oleh Supabase Authentication.</p><p><b>Username:</b> ${esc(session.username)}<br><b>Nama:</b> ${esc(session.full_name)}<br><b>Role:</b> ${esc(session.role)}</p><button class="btn primary" onclick="changePassword()">Ubah Password</button></div>`}
async function changePassword(){const next=prompt('Masukkan password baru (minimal 6 karakter):');if(!next||next.length<6){if(next!==null)toast('Password minimal 6 karakter');return}const {error}=await supabaseClient.auth.updateUser({password:next});if(error)toast(errMsg(error));else toast('Password berhasil diubah')}
function showModal(inner){$('modal').innerHTML=`<div class="modal-card">${inner}</div>`;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()}
(async()=>{try{const {data:{session:as}}=await supabaseClient.auth.getSession();if(as){const p=await loadProfile();if(p&&p.active){session=p;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await render()}}}catch(e){console.warn(e)}})();
</script>
</body>
</html>
